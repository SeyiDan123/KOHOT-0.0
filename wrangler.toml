name = "kohot"
main = "worker/index.ts"
compatibility_date = "2024-04-01"

# Serve the website files, and send /api/* requests to the Worker
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "kohot-production-d1"
database_id = "39d379c8-e5f3-4503-9473-f884da21d396"

# Environment Variables
[vars]
HOST_EMAIL = "seyidan03@gmail.com"
STANDARD_PRICE_NGN = "50000"
STANDARD_PRICE_KOBO = "5000000"
EMAIL_PROVIDER = "resend"
EMAIL_FROM = "KoHot <onboarding@resend.dev>"
DAILY_SEND_CAP = "90"
TEST_MODE = "true"
TEST_EMAIL = "seyidan03@gmail.com"

# Reminders are paused for now. Remove the # on the next two lines later.
# [triggers]
# crons = ["*/15 * * * *"]

# Secrets to add in Cloudflare later (not in this file):
# PAYSTACK_SECRET_KEY, SESSION_SECRET, GOOGLE_CLIENT_ID, RESEND_API_KEY
